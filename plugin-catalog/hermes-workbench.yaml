description: The Anakot desktop app in your browser. `anakot workbench` serves the desktop interface through the Anakot dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `anakot workbench` run and again after each Anakot update it runs `npm install --ignore-scripts` (guided by Anakot's lockfile) and Vite against your Anakot checkout's desktop sources, writing only under ~/.anakot/anakot-workbench and its own plugin dir (the checkout is only read), and starts `anakot dashboard` on loopback when none is running.
