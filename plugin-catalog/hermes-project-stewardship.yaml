name: anakot-project-stewardship
repo: https://github.com/Sahil-SS9/anakot-project-stewardship
sha: 1e6792c1d32fadd63705e3329aece01de6c4380c
description: "Durable project ownership and bounded initiative management for Anakot fleets. Disclosure — a `pre_llm_call` hook adds a project's saved rules, decisions and facts to turns of bots assigned to that project; objective checks run allowlisted local programs only at autonomy level 3+ and GitHub objectives shell out to your own `gh api`; it creates and edits Anakot Kanban tasks through Anakot' internal kanban modules (title/body/tenant written directly to kanban.db), keeps its own SQLite DB under `<Anakot home>/plugin-data/anakot-dockyard/`, and its optional HTTP API (`/stewardship/v1`, 127.0.0.1) stays closed until you set a bearer token."
maintainer: Sahil-SS9
tier: community
category: automation
requires_anakot: ">=0.21"
docs_url: https://github.com/Sahil-SS9/anakot-project-stewardship
platforms: []
capabilities:
  provides_tools:
    - steward_status
    - steward_run_cycle
    - steward_propose_initiative
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env: []
version: 0.5.5
